services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: db_customers
      MYSQL_USER: mkt
      MYSQL_PASSWORD: mkt_secret
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mkt", "-pmkt_secret"]
      interval: 10s
      timeout: 5s
      retries: 5

  customer-service:
    build: .
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_SCHEMA: db_customers
      DB_USER: mkt
      DB_PASSWORD: mkt_secret
