apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: supermarket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: CUSTOMER_SERVICE_URL
              value: http://customer-service:8081
            - name: SALES_POINT_SERVICE_URL
              value: http://sales-point-service:8082
            - name: SALES_SERVICE_URL
              value: http://sales-service:8083
            - name: INVENTORY_SERVICE_URL
              value: http://inventory-service:8084
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: supermarket
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
