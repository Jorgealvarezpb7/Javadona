apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-service
  namespace: supermarket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sales-service
  template:
    metadata:
      labels:
        app: sales-service
    spec:
      containers:
        - name: sales-service
          image: sales-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_SCHEMA
              value: db_sales
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: password
            - name: SERVICES_CUSTOMER_URL
              value: http://customer-service:8081
            - name: SERVICES_SALES_POINT_URL
              value: http://sales-point-service:8082
            - name: SERVICES_INVENTORY_URL
              value: http://inventory-service:8084
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: sales-service
  namespace: supermarket
spec:
  selector:
    app: sales-service
  ports:
    - port: 8083
      targetPort: 8080
