apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-point-service
  namespace: supermarket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sales-point-service
  template:
    metadata:
      labels:
        app: sales-point-service
    spec:
      containers:
        - name: sales-point-service
          image: sales-point-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_SCHEMA
              value: db_sales_points
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: password
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: sales-point-service
  namespace: supermarket
spec:
  selector:
    app: sales-point-service
  ports:
    - port: 8082
      targetPort: 8080
