services:
  api-gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Point to host services when running the gateway in isolation.
      # Replace host.docker.internal with actual hostnames if needed.
      CUSTOMER_SERVICE_URL: http://host.docker.internal:8081
      SALES_POINT_SERVICE_URL: http://host.docker.internal:8082
      SALES_SERVICE_URL: http://host.docker.internal:8083
      INVENTORY_SERVICE_URL: http://host.docker.internal:8084
