services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: db_sales
      MYSQL_USER: mkt
      MYSQL_PASSWORD: mkt_secret
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mkt", "-pmkt_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql-sales-data:/var/lib/mysql
  sales-service:
    build: .
    ports:
      - "8083:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_SCHEMA: db_sales
      DB_USER: mkt
      DB_PASSWORD: mkt_secret
      SERVICES_CUSTOMER_URL: http://localhost:8081
      SERVICES_SALES_POINT_URL: http://localhost:8082
      SERVICES_INVENTORY_URL: http://localhost:8084
volumes:
  mysql-sales-data:
