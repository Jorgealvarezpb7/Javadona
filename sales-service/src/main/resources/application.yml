spring:
  application:
    name: sales-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_SCHEMA:db_sales}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:mkt}
    password: ${DB_PASSWORD:mkt_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
services:
  customer:
    url: ${SERVICES_CUSTOMER_URL:http://localhost:8081}
  sales-point:
    url: ${SERVICES_SALES_POINT_URL:http://localhost:8082}
  inventory:
    url: ${SERVICES_INVENTORY_URL:http://localhost:8084}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, metrics
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
